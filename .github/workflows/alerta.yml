
name: Hola Mundo - Notificacion CI

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node hola.js

      - name: Enviar notificacion a ntfy
        run: |
          curl -sS \
            -H "Title: GitHub Actions - ITLA" \
            -H "Content-Type: text/plain" \
            -d "Se ha subido codigo a main del repositorio ${{ github.repository }}. Commit: ${{ github.sha }}" \
            https://ntfy.sh/devops-itla
